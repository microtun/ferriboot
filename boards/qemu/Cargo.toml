# QEMU board workspace: the bootloader, the test firmware and the board
# layout crate they share. The machine support crate, ../../ferriboot-qemu,
# is its own workspace and is used here as a path dependency with the
# `mps2-an385` machine feature.
[workspace]
resolver = "3"
members = ["ferriboot", "firmware", "layout"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
ferriboot-core = { path = "../../ferriboot-core", default-features = false, features = ["log"] }
ferriboot-build = { path = "../../ferriboot-build" }
ferriboot-test-hooks = { path = "../../testing/ferriboot-test-hooks" }
ferriboot-qemu = { path = "../../ferriboot-qemu", features = ["mps2-an385"] }
qemu-layout = { path = "layout" }
cortex-m = { version = "0.7.9", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.7"
critical-section = "1.2"
embassy-executor = "0.10"
embassy-time = "0.5"
embassy-time-driver = "0.2"
embassy-time-queue-utils = "0.3"
embedded-storage = "0.3.2"
rand = { version = "0.9.5", default-features = false }
log = { version = "0.4", default-features = false }

[profile.release]
opt-level = 2
lto = "thin"
debug = 2
panic = "abort"

[profile.dev]
opt-level = 1
panic = "abort"
