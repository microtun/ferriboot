[package]
license-file.workspace = true
name = "qemu-ferriboot"
description = "QEMU Cortex-M3 bootloader for firmware upgrade tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "qemu-ferriboot"
path = "src/main.rs"
test = false
bench = false

[features]
default = ["downgrade-prevention", "bootstrap", "uuid"]
downgrade-prevention = []
bootstrap = []
overwrite-only = []
direct-xip = []
direct-xip-revert = []
# Optional imgtool name-to-UUID conversion; fixed preset IDs work without it.
uuid = ["ferriboot-core/uuid"]

[dependencies]
ferriboot-core = { workspace = true, features = ["log"] }
ferriboot-qemu.workspace = true
ferriboot-layout-qemu.workspace = true
cortex-m = { workspace = true, features = ["critical-section-single-core"] }
cortex-m-rt.workspace = true
embedded-storage.workspace = true
rand.workspace = true
log.workspace = true

[build-dependencies]
ferriboot-layout-qemu.workspace = true
ferriboot-build.workspace = true

# Every `unsafe` block states why it is sound, one operation at a time.
[lints.clippy]
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
