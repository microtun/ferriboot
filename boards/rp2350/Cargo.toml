# RP2350 board workspace: the bootloader, the example firmware and the board
# layout crate they share. Build and run each binary from its own directory
# (`cd ferriboot && cargo run --release`) so its runner applies; `cargo build`,
# `cargo clippy` and `cargo doc` here cover the binaries and the layout crate.
#
# The chip support crate, ../../ferriboot-rp, is its own workspace and is used
# here as a path dependency with the `rp235xa` chip feature.
#
# The fixture flash algorithm (`flash-algorithm/`) is a separate workspace: it
# uses another target (soft-float) and its own linker script.
[workspace]
resolver = "3"
members = ["ferriboot", "firmware", "layout"]
exclude = ["flash-algorithm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
ferriboot-build = { path = "../../ferriboot-build" }
ferriboot-core = { path = "../../ferriboot-core", default-features = false }
ferriboot-rp = { path = "../../ferriboot-rp", features = ["rp235xa"] }
rp2350-layout = { path = "layout" }
ferriboot-test-hooks = { path = "../../testing/ferriboot-test-hooks" }

cortex-m = { version = "0.7.9", features = ["inline-asm"] }
cortex-m-rt = "0.7.7"
embassy-executor = "0.10"
embassy-rp = { version = "0.10.0", default-features = false, features = ["rp235xa", "rt", "critical-section-impl"] }
embassy-time = "0.5"
embedded-storage = "0.3.2"
log = { version = "0.4", default-features = false }
sha2 = { version = "0.10.9", default-features = false }

# Both binaries are size-optimized with fat LTO and abort on panic.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
debug = 2
panic = "abort"
incremental = false

[profile.dev]
opt-level = "z"
panic = "abort"
