[package]
license-file.workspace = true
name = "rp2350-pico2-firmware"
description = "RP2350 Ferriboot example firmware"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "rp2350-pico2-firmware"
path = "src/main.rs"
test = false
bench = false

[dependencies]
ferriboot-core = { workspace = true, features = ["log"] }
ferriboot-rp = { workspace = true, features = ["uart-log"] }
ferriboot-layout-rp2350-pico2 = { workspace = true }
ferriboot-test-hooks = { workspace = true }
embassy-executor = { workspace = true }
embassy-time = { workspace = true }
cortex-m = { workspace = true }
cortex-m-rt = { workspace = true }
embassy-rp = { workspace = true, features = ["imagedef-none", "executor-thread", "time-driver"] }
embedded-storage = { workspace = true }
log = { workspace = true }

[build-dependencies]
ferriboot-build = { workspace = true }
ferriboot-layout-rp2350-pico2 = { workspace = true }

[features]
default = []
# Optional imgtool name-to-UUID conversion; fixed preset IDs work without it.
uuid = ["ferriboot-rp/uuid"]

# Every `unsafe` block states why it is sound, one operation at a time.
[lints.clippy]
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
