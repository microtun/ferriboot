# ESP32-C3 board workspace: Ferriboot (third stage), the example firmware and
# the board layout crate they share. Build and run each binary from its own
# directory (`cd ferriboot && cargo run --release`): each directory's
# .cargo/config.toml installs a different runner (flash-ferriboot vs
# flash-app). Ferriboot is not a default member, so `cargo build` /
# `cargo clippy` here cover the firmware and the layout crate.
#
# The chip support crate, ../../ferriboot-esp, is its own workspace and is
# used here as a path dependency with the `esp32c3` chip feature.
[workspace]
resolver = "3"
members = ["ferriboot", "firmware", "layout"]
default-members = ["firmware", "layout"]
exclude = []

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
ferriboot-build = { path = "../../ferriboot-build" }
ferriboot-core = { path = "../../ferriboot-core", default-features = false }
ferriboot-esp = { path = "../../ferriboot-esp", default-features = false, features = ["esp32c3"] }
esp32c3-layout = { path = "layout" }
ferriboot-test-hooks = { path = "../../testing/ferriboot-test-hooks" }
embassy-executor = "0.10"
embassy-time = "0.5"
embedded-storage = "0.3.2"
esp-bootloader-esp-idf = { version = "0.6", default-features = false, features = ["esp32c3"] }
esp-println = { version = "0.18", default-features = false, features = ["esp32c3", "log-04", "jtag-serial"] }
log = { version = "0.4", default-features = false }
riscv = { version = "0.15", default-features = false }

# Profiles are Ferriboot's, so its whole dependency graph is built exactly
# as before; the firmware package overrides what differs for it. (`lto` and
# `panic` cannot be set per package; both binaries use fat LTO and abort.)
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
debug = 2
panic = "abort"
incremental = false

[profile.release.package.esp32c3-firmware]
opt-level = "s"

[profile.dev]
# Optimise general code; reserve 4 KiB normal IRAM for the handoff and high DRAM for its stack.
opt-level = "z"
lto = "fat"
codegen-units = 1
debug = 2
panic = "abort"
# Match release code generation in Ferriboot's destructive handoff.
# Compiler-inserted panic/precondition helpers live in RAM that the
# application has overwritten.
debug-assertions = false
overflow-checks = false

[profile.dev.package.esp32c3-firmware]
opt-level = "s"
debug-assertions = true
overflow-checks = true
