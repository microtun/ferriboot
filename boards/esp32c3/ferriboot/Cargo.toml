[package]
license = "MIT OR Apache-2.0"
name = "esp32c3-ferriboot"
description = "ESP32-C3 signed third-stage upgrade manager (ESP-IDF factory application)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "esp32c3-ferriboot"
path = "src/main.rs"
test = false
bench = false

[dependencies]
ferriboot-core = { workspace = true, features = ["log"] }
ferriboot-esp = { workspace = true, features = ["log", "boot-runtime"] }
esp-hal = { version = "1.2.2", default-features = false, features = ["esp32c3", "exception-handler", "rt", "unstable", "log-04"] }
# Logs go to the native USB-Serial-JTAG port.
esp-println = { workspace = true }
# Standard ESP-IDF app descriptor, required for the IDF second stage to load
# Ferriboot as the factory app.
esp-bootloader-esp-idf = { workspace = true }
log = { workspace = true }
riscv = { workspace = true }

[build-dependencies]
ferriboot-build = { workspace = true }
esp32c3-layout = { workspace = true }

[features]
# Reject older upgrades and recover an invalid primary from the secondary slot.
default = ["downgrade-prevention", "bootstrap", "uuid"]
# Opt in to the standalone RAM loader's USB Serial/JTAG diagnostics.
bl-loader-diagnostics = ["ferriboot-esp/bl-loader-diagnostics"]
# Upgrade strategy (default: swap using scratch).
overwrite-only = []
direct-xip = []
direct-xip-revert = []
# Refuse to install images older than the one in the primary slot.
downgrade-prevention = []
# Install the secondary image if the primary slot holds no valid image.
bootstrap = []
# Optional imgtool name-to-UUID conversion; fixed preset IDs work without it.
uuid = ["ferriboot-esp/uuid"]

# Every `unsafe` block states why it is sound, one operation at a time.
[lints.clippy]
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
