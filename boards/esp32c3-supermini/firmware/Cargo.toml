[package]
license-file.workspace = true
name = "esp32c3-supermini-firmware"
description = "ESP32-C3 Ferriboot example firmware"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "esp32c3-supermini-firmware"
path = "src/main.rs"
test = false
bench = false

[dependencies]
ferriboot-core = { workspace = true, features = ["log"] }
ferriboot-esp = { workspace = true }
ferriboot-test-hooks = { workspace = true }
embedded-storage = { workspace = true }
# esp-rtos supplies the executor and time driver; do not enable an
# embassy-executor arch-* feature or an embassy-time generic queue.
embassy-executor = { workspace = true }
embassy-time = { workspace = true }
esp-bootloader-esp-idf = { workspace = true }
# Keep esp-hal's normal runtime and exception handler, as upstream examples do.
# Same esp-hal release as the bootloader.
esp-hal = { version = "1.2.2", features = ["esp32c3", "unstable", "log-04"] }
esp-rtos = { version = "0.4", default-features = false, features = ["esp32c3", "embassy", "log-04"] }
# Use esp-println for USB-Serial-JTAG application logging.
esp-println = { workspace = true, features = ["critical-section"] }
log = { workspace = true }

[build-dependencies]
ferriboot-build = { workspace = true }
ferriboot-layout-esp32c3-supermini = { workspace = true }

[features]
# Optional imgtool name-to-UUID conversion; fixed preset IDs work without it.
uuid = ["ferriboot-esp/uuid"]

# Every `unsafe` block states why it is sound, one operation at a time.
[lints.clippy]
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
