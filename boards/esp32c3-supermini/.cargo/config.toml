# Shared by everything built from this board directory. Each binary's own
# .cargo/config.toml adds its runner.
[build]
target = "riscv32imc-unknown-none-elf"

[target.riscv32imc-unknown-none-elf]
rustflags = ["-C", "force-frame-pointers"]

[env]
# Bootstrap locator: the table cannot describe its own address. Host tools
# also read this setting and check that partitions leave its sector free.
# Keep the ESP-IDF second-stage sdkconfig offset in agreement.
ESP_BOOTLOADER_ESP_IDF_CONFIG_PARTITION_TABLE_OFFSET = "65536"

# Profiles for ESP binaries when invoked from this board directory. All
# packages share the root workspace; local Cargo config overrides its profile.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
debug = 2
panic = "abort"
incremental = false

[profile.release.package.esp32c3-supermini-firmware]
opt-level = "s"

[profile.dev]
opt-level = "z"
lto = "fat"
codegen-units = 1
debug = 2
panic = "abort"
debug-assertions = false
overflow-checks = false

[profile.dev.package.esp32c3-supermini-firmware]
opt-level = "s"
debug-assertions = true
overflow-checks = true
