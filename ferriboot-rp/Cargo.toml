# This package belongs to the repository workspace.

[package]
license = "MIT OR Apache-2.0"
name = "ferriboot-rp"
description = "RP2350 chip support for Ferriboot: checked board layouts, boot handoff and updater"
# Publishes the selected chip to the build scripts of dependent binaries
# (DEP_FERRIBOOT_RP_CHIP), see ferriboot_build::check_platform_chip.
links = "ferriboot-rp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
ferriboot-core = { path = "../ferriboot-core", default-features = false }
embedded-storage = "0.3.2"
rand = { version = "0.9.5", default-features = false }
embassy-rp = { version = "0.10.0", default-features = false, features = ["unstable-pac"] }
cortex-m = { version = "0.7.9", features = ["inline-asm"] }
log = { version = "0.4", default-features = false, optional = true }

[build-dependencies]
ferriboot-build = { path = "../ferriboot-build" }
ferriboot-chip-rp2350 = { workspace = true }

[features]
# Exactly one package variant. Both are the RP2350 (chips/rp2350); the
# variant only selects embassy-rp's pin count.
rp235xa = ["embassy-rp/rp235xa"]
rp235xb = ["embassy-rp/rp235xb"]
log = ["ferriboot-core/log"]
defmt = ["ferriboot-core/defmt"]
uuid = ["ferriboot-core/uuid"]
# Polling UART0 `log` backend shared by the bootloader and the example firmware.
uart-log = ["dep:log"]

# Every `unsafe` block states why it is sound, one operation at a time.
[lints.clippy]
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
