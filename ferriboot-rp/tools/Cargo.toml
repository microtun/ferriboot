[package]
name = "ferriboot-tools-rp2350"
description = "Ferriboot RP2350 host tooling: ELF export, PICOBIN, ROM sealing, SWD loading, flash algorithm"
license-file.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["cli"]
# The `ferriboot-tools-rp2350` binary.
cli = ["dep:clap", "ferriboot-build/cli"]

[[bin]]
name = "ferriboot-tools-rp2350"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
anyhow = { workspace = true }
base64 = "0.22"
clap = { workspace = true, optional = true }
ferriboot-build = { workspace = true, features = ["tools"] }
k256 = { version = "0.13", features = ["pem"] }
rand_core = { workspace = true }
ferriboot-layout-rp2350-pico2 = { workspace = true }
serde = "1"
serde_json = { workspace = true }
sha2 = { workspace = true, features = ["std", "oid"] }
tempfile = { workspace = true }

[lints]
workspace = true
