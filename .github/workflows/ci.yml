name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  # Called by release.yml to gate signing on the full CI suite.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  lint:
    name: Format and host Clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Generate development signing keys
        run: |
          umask 077
          mkdir -p keys boards/esp32c3/keys boards/rp2350/keys
          ./keys/generate.sh
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out boards/esp32c3/keys/dev-esp32c3-sbv2-rsa3072.pem
          openssl pkey -in boards/esp32c3/keys/dev-esp32c3-sbv2-rsa3072.pem -pubout -out boards/esp32c3/keys/dev-esp32c3-sbv2-rsa3072.pub.pem
          openssl ecparam -name secp256k1 -genkey -noout -out boards/rp2350/keys/dev-rp2350-rom-secp256k1.pem
          openssl pkey -in boards/rp2350/keys/dev-rp2350-rom-secp256k1.pem -pubout -out boards/rp2350/keys/dev-rp2350-rom-secp256k1.pub.pem
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The main workspace formats all platform and board crates. Two standalone
      # SRAM payload workspaces need separate formatting passes.
      - name: Check Rust formatting (all workspaces)
        run: |
          for manifest in \
            Cargo.toml \
            boards/rp2350/flash-algorithm/Cargo.toml \
            ferriboot-esp/bl-loader/Cargo.toml; do
            cargo fmt --manifest-path "$manifest" --all -- --check
          done
      - name: Clippy (host crates and unit tests)
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Clippy (QEMU regression harness)
        run: cargo clippy -p ferriboot-hil --all-targets --features qemu,regression --locked -- -D warnings

  build:
    name: Build and Clippy / ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ESP32-C3
            target: riscv32imc-unknown-none-elf
            board-dir: boards/esp32c3
            packages: -p ferriboot-bootloader-esp32c3 -p ferriboot-firmware-esp32c3
            lint-packages: -p ferriboot-bootloader-esp32c3 -p ferriboot-firmware-esp32c3 -p ferriboot-layout-esp32c3 -p ferriboot-esp
            clippy-targets: --bins --lib
          - name: RP2350
            target: thumbv8m.main-none-eabihf
            board-dir: boards/rp2350
            packages: -p ferriboot-bootloader-rp2350 -p ferriboot-firmware-rp2350
            lint-packages: -p ferriboot-bootloader-rp2350 -p ferriboot-firmware-rp2350 -p ferriboot-layout-rp2350 -p ferriboot-rp
            clippy-targets: --bins --lib
          - name: QEMU
            target: thumbv7m-none-eabi
            board-dir: boards/qemu
            packages: -p ferriboot-bootloader-qemu -p ferriboot-firmware-qemu
            lint-packages: -p ferriboot-bootloader-qemu -p ferriboot-firmware-qemu -p ferriboot-layout-qemu -p ferriboot-qemu
            clippy-targets: --bins --lib
          - name: RP2350 flash algorithm
            target: thumbv8m.main-none-eabi
            board-dir: boards/rp2350/flash-algorithm
            packages: -p rp2350-flash-algorithm
            lint-packages: -p rp2350-flash-algorithm
            clippy-targets: --bins
    steps:
      - uses: actions/checkout@v7
      - name: Generate development signing keys
        run: |
          umask 077
          mkdir -p keys boards/esp32c3/keys boards/rp2350/keys
          ./keys/generate.sh
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out boards/esp32c3/keys/dev-esp32c3-sbv2-rsa3072.pem
          openssl pkey -in boards/esp32c3/keys/dev-esp32c3-sbv2-rsa3072.pem -pubout -out boards/esp32c3/keys/dev-esp32c3-sbv2-rsa3072.pub.pem
          openssl ecparam -name secp256k1 -genkey -noout -out boards/rp2350/keys/dev-rp2350-rom-secp256k1.pem
          openssl pkey -in boards/rp2350/keys/dev-rp2350-rom-secp256k1.pem -pubout -out boards/rp2350/keys/dev-rp2350-rom-secp256k1.pub.pem
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            boards/rp2350/flash-algorithm -> target
      # Cargo discovers .cargo/config.toml from the working directory, not
      # from --manifest-path. Running inside the board directory loads its
      # target triple, linker rustflags, and board-specific environment.
      # All ordinary crates share the root workspace, so select only the
      # current target's packages (no cross-target feature unification).
      - name: Build complete board (release)
        working-directory: ${{ matrix.board-dir }}
        run: cargo build --release --locked ${{ matrix.packages }}
      - name: Clippy (embedded target)
        working-directory: ${{ matrix.board-dir }}
        run: cargo clippy ${{ matrix.lint-packages }} ${{ matrix.clippy-targets }} --locked -- -D warnings

  test:
    name: Host unit and integration tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Generate development signing keys
        run: |
          umask 077
          mkdir -p keys boards/esp32c3/keys boards/rp2350/keys
          ./keys/generate.sh
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out boards/esp32c3/keys/dev-esp32c3-sbv2-rsa3072.pem
          openssl pkey -in boards/esp32c3/keys/dev-esp32c3-sbv2-rsa3072.pem -pubout -out boards/esp32c3/keys/dev-esp32c3-sbv2-rsa3072.pub.pem
          openssl ecparam -name secp256k1 -genkey -noout -out boards/rp2350/keys/dev-rp2350-rom-secp256k1.pem
          openssl pkey -in boards/rp2350/keys/dev-rp2350-rom-secp256k1.pem -pubout -out boards/rp2350/keys/dev-rp2350-rom-secp256k1.pub.pem
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Test default host packages
        run: cargo test --locked
      # With no physical-board features enabled, HIL tests are host-only.
      - name: Test HIL host helpers
        run: cargo test -p ferriboot-hil --locked

  qemu-regression:
    name: QEMU HIL regression
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml
      - name: Generate development signing keys
        run: |
          umask 077
          mkdir -p keys boards/esp32c3/keys boards/rp2350/keys
          ./keys/generate.sh
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out boards/esp32c3/keys/dev-esp32c3-sbv2-rsa3072.pem
          openssl pkey -in boards/esp32c3/keys/dev-esp32c3-sbv2-rsa3072.pem -pubout -out boards/esp32c3/keys/dev-esp32c3-sbv2-rsa3072.pub.pem
          openssl ecparam -name secp256k1 -genkey -noout -out boards/rp2350/keys/dev-rp2350-rom-secp256k1.pem
          openssl pkey -in boards/rp2350/keys/dev-rp2350-rom-secp256k1.pem -pubout -out boards/rp2350/keys/dev-rp2350-rom-secp256k1.pub.pem
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: thumbv7m-none-eabi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            boards/qemu -> target
      - name: Install MCUboot imgtool
        run: python -m pip install imgtool
      # Build the same pinned/patched QEMU as boards/qemu/qemu/Dockerfile.qemu,
      # but natively on Ubuntu: the Docker image uses Debian trixie, whose
      # newer glibc is not compatible with the hosted Ubuntu runner.
      - name: Install QEMU build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git libfdt-dev libglib2.0-dev libpixman-1-dev \
            ninja-build pkg-config python3-venv zlib1g-dev
      # Restore the native Ubuntu binary; this key changes whenever the
      # pinned QEMU version, runner base, or downstream patch changes.
      - name: Restore patched QEMU binary
        id: qemu-cache
        uses: actions/cache/restore@v6
        with:
          path: target/qemu/qemu-system-arm
          key: qemu-v10.1.0-ubuntu-24.04-v1-${{ hashFiles('boards/qemu/qemu/0001-an385-ferriboot-test-peripherals.patch') }}
      - name: Build pinned QEMU 10.1.0 with Ferriboot board patch
        if: steps.qemu-cache.outputs.cache-hit != 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/qemu-build-venv"
          "$RUNNER_TEMP/qemu-build-venv/bin/pip" install meson
          export PATH="$RUNNER_TEMP/qemu-build-venv/bin:$PATH"
          git clone --depth 1 --branch v10.1.0 https://gitlab.com/qemu-project/qemu.git "$RUNNER_TEMP/qemu-src"
          git -C "$RUNNER_TEMP/qemu-src" apply --check "$GITHUB_WORKSPACE/boards/qemu/qemu/0001-an385-ferriboot-test-peripherals.patch"
          git -C "$RUNNER_TEMP/qemu-src" apply "$GITHUB_WORKSPACE/boards/qemu/qemu/0001-an385-ferriboot-test-peripherals.patch"
          cd "$RUNNER_TEMP/qemu-src"
          ./configure --target-list=arm-softmmu \
            --disable-docs --disable-rust --disable-slirp --disable-werror
          ninja -C build qemu-system-arm
          mkdir -p "$GITHUB_WORKSPACE/target/qemu"
          cp build/qemu-system-arm "$GITHUB_WORKSPACE/target/qemu/qemu-system-arm"
      # Save immediately after building so failed regression tests don't
      # discard a successfully built (and expensive) QEMU executable.
      - name: Save patched QEMU binary
        if: steps.qemu-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: target/qemu/qemu-system-arm
          key: ${{ steps.qemu-cache.outputs.cache-primary-key }}
      - name: Verify patched emulator
        run: |
          test -x target/qemu/qemu-system-arm
          target/qemu/qemu-system-arm --version
          target/qemu/qemu-system-arm -M help | grep -q mps2-an385
      - name: Run full QEMU HIL regression suite
        env:
          FERRIBOOT_QEMU_BIN: ${{ github.workspace }}/target/qemu/qemu-system-arm
        run: cargo test -p ferriboot-hil --features qemu,regression --locked -- --test-threads=2
