[workspace]
resolver = "3"
members = [
    "ferriboot-build",
    "ferriboot-core",
    "ferriboot-esp",
    "ferriboot-rp",
    "ferriboot-qemu",
    "ferriboot-esp/tools",
    "ferriboot-rp/tools",
    "ferriboot-qemu/tools",
    "chips/*",
    "boards/esp32c3-supermini/ferriboot",
    "boards/esp32c3-supermini/firmware",
    "boards/esp32c3-supermini/layout",
    "boards/rp2350-pico2/ferriboot",
    "boards/rp2350-pico2/firmware",
    "boards/rp2350-pico2/layout",
    "boards/qemu/ferriboot",
    "boards/qemu/firmware",
    "boards/qemu/layout",
    "testing/ferriboot-hil",
    "testing/ferriboot-test-hooks",
]
# Root commands select only host-side packages; embedded board builds must
# select packages explicitly from the corresponding boards/<board> directory.
# `cargo test` also skips the HIL harness (some scenarios need hardware).
default-members = [
    "ferriboot-build",
    "ferriboot-core",
    "ferriboot-esp/tools",
    "ferriboot-rp/tools",
    "ferriboot-qemu/tools",
    "testing/ferriboot-test-hooks",
]
# Only independently built SRAM payloads are nested workspaces.
exclude = ["ferriboot-esp/bl-loader", "boards/rp2350-pico2/flash-algorithm"]

# Host and platform-independent crates contain no `unsafe` and must stay
# that way (ferriboot-core also has `#![forbid(unsafe_code)]`).
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.metadata.ferriboot]
name = "ferriboot"

[workspace.package]
version = "0.1.7"
edition = "2024"
rust-version = "1.95"
license-file = "LICENSE"

[workspace.dependencies]
ferriboot-core = { path = "ferriboot-core", default-features = false }
ferriboot-test-hooks = { path = "testing/ferriboot-test-hooks" }
# Shared host helpers and board tool libraries. Board crates enable their CLI
# by default; library users (including HIL) get them without clap.
ferriboot-build = { path = "ferriboot-build", default-features = false }
ferriboot-tools-esp = { path = "ferriboot-esp/tools", default-features = false }
ferriboot-tools-rp2350 = { path = "ferriboot-rp/tools", default-features = false }
ferriboot-tools-qemu = { path = "ferriboot-qemu/tools", default-features = false }

# Lightweight, board-independent chip descriptions.
ferriboot-chip-esp32c3 = { path = "chips/esp32c3" }
ferriboot-chip-rp235x = { path = "chips/rp235x" }
ferriboot-chip-qemu = { path = "chips/qemu" }

# Platform crates and board layout crates.
ferriboot-esp = { path = "ferriboot-esp", default-features = false, features = ["esp32c3"] }
ferriboot-rp = { path = "ferriboot-rp", default-features = false, features = ["rp235xa"] }
ferriboot-qemu = { path = "ferriboot-qemu", default-features = false, features = ["mps2-an385"] }
ferriboot-layout-esp32c3-supermini = { path = "boards/esp32c3-supermini/layout" }
ferriboot-layout-rp2350-pico2 = { path = "boards/rp2350-pico2/layout" }
ferriboot-layout-qemu = { path = "boards/qemu/layout" }

# Shared firmware dependencies (each board opts into its own target features).
embassy-executor = "0.10"
embassy-time = "0.5"
embassy-rp = { version = "0.10.0", default-features = false, features = ["rp235xa", "rt", "critical-section-impl"] }
esp-bootloader-esp-idf = { version = "0.6", default-features = false, features = ["esp32c3"] }
esp-println = { version = "0.18", default-features = false, features = ["esp32c3", "log-04", "jtag-serial"] }
cortex-m = { version = "0.7.9", features = ["inline-asm"] }
cortex-m-rt = "0.7.7"
critical-section = "1.2"
embassy-time-driver = "0.2"
embassy-time-queue-utils = "0.3"
riscv = { version = "0.15", default-features = false }

# no_std crates. Members add the features they need.
rand = { version = "0.9.5", default-features = false }
defmt = "1"
defmt-or-log = { version = "0.2.3", default-features = false }
embedded-storage = "0.3.2"
log = { version = "0.4", default-features = false }
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa"] }
sha2 = { version = "0.10.9", default-features = false }
uuid = { version = "1", default-features = false, features = ["v5"] }

# Host-only crates (build helper and hardware harness).
lz4_flex = "0.14.0"
espflash = { version = "4.6", default-features = false, features = ["serialport"] }
pem = "3"
serde_json = "1"
probe-rs = "0.32.0"
probe-rs-espressif = "0.32.0"
serialport = { version = "4.10", default-features = false }
tempfile = "3"

# Host tools.
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
elf = "0.8"
esp-idf-part = "0.6"
rand_core = { version = "0.6", features = ["getrandom"] }

[profile.test]
opt-level = 2
