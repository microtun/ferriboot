# This package belongs to the repository workspace.

[package]
license-file.workspace = true
name = "ferriboot-qemu"
description = "QEMU Cortex-M3 machine support for Ferriboot tests: SPI NOR, checked layouts, handoff"
# Publishes the selected machine to the build scripts of dependent binaries
# (DEP_FERRIBOOT_QEMU_CHIP), see ferriboot_build::check_platform_chip.
links = "ferriboot-qemu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
ferriboot-core = { path = "../ferriboot-core", default-features = false }
ferriboot-chip-qemu = { workspace = true }
embedded-storage = "0.3.2"
rand = { version = "0.9.5", default-features = false }
cortex-m = { version = "0.7.9", features = ["inline-asm"] }
log = { version = "0.4", default-features = false }

[build-dependencies]
ferriboot-build = { path = "../ferriboot-build" }

[features]
# Exactly one machine: QEMU mps2-an385 with Ferriboot's test peripherals
# patch (chips/qemu/).
mps2-an385 = []

# Every `unsafe` block states why it is sound, one operation at a time.
[lints.clippy]
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
