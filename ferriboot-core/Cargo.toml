[package]
license = "MIT OR Apache-2.0"
name = "ferriboot-core"
description = "Platform-independent image verification, boot upgrades, and firmware updates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
embedded-storage = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true, features = ["force-soft-compact"] }
p256 = { workspace = true }
uuid = { workspace = true, optional = true }
log = { workspace = true, optional = true }
defmt = { workspace = true, optional = true }
defmt-or-log = { workspace = true }

[features]
default = ["uuid"]
# Select at most one diagnostic backend; neither keeps logging disabled.
log = ["dep:log", "defmt-or-log/log"]
defmt = ["dep:defmt", "defmt-or-log/defmt"]
# imgtool-compatible `--vid/--cid` literal parsing and name -> UUID derivation.
uuid = ["dep:uuid"]

[dev-dependencies]
p256 = { workspace = true }
sha2 = { workspace = true, features = ["force-soft-compact"] }

[lints]
workspace = true
